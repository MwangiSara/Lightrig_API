<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Contact Form Submission</title>
  </head>
  <body
    style="
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      background-color: #f9f9f9;
      padding: 20px;
    "
  >
    <div
      style="
        padding: 20px;
        border: 1px solid #ddd;
        max-width: 600px;
        margin: auto;
        background-color: #fff;
        border-radius: 8px;
      "
    >
      <p style="font-size: 16px; margin-bottom: 20px">
        New Contact Form Submission:
      </p>

      <div style="margin: 10px 0 20px 0">
        <ul style="padding-left: 20px">
          <li>
            <strong>From:</strong> {{ message.name }} &lt;{{ message.email
            }}&gt;
          </li>
          <li><strong>Subject:</strong> {{ message.subject }}</li>
          <li><strong>Message:</strong> {{ message.message }}</li>
          <li><strong>Received:</strong> {{ message.created_at }}</li>
        </ul>
      </div>

      <div style="margin-top: 30px">
        <p>
          <span>--</span><br />
          Best regards,<br />
          Sarah M,<br />
          LightRig Admin.
        </p>
      </div>
    </div>

    <div
      style="
        padding-top: 10px;
        max-width: 350px;
        margin: auto;
        font-size: 12px;
        color: gray;
        text-align: center;
      "
    >
      Sent by LightRig •
      <a
        href="https://lightrig-8uy4.vercel.app/"
        style="color: #1a73e8; text-decoration: none"
        >Website</a
      >
      • Nairobi, Kenya
    </div>
  </body>
</html>
